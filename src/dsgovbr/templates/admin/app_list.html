{% load i18n %}
{% comment %}
  Pastas do menu (um <dsgovbr-pasta> por app). Usado dentro do <dsgovbr-menu>
  (dsgovbr/menu.html), que lê os filhos uma vez e monta o HTML final.
{% endcomment %}
{% for app in app_list %}
  <dsgovbr-pasta rotulo="{{ app.name }}" icone="{{ app.icon|default:'fas fa-folder' }}" id="menu-app-{{ app.app_label }}"{% if app.app_url in request.path|urlencode or app.open %} aberta{% endif %}>
    {% include 'dsgovbr/menu_items.html' with items=app.models %}
  </dsgovbr-pasta>
{% endfor %}
