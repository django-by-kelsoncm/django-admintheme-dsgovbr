{% load i18n static %}
{% if cl.search_fields %}
    <div class="collapse{% if cl.query %} show{% endif %}" id="changelist-search-bar">
        {# dentro do #changelist-form (GET): um <form> aqui seria aninhado #}
        <div id="changelist-search" role="search" class="d-flex gap-2 mb-3">
            <label class="visually-hidden" for="searchbar">Buscar nesta listagem</label>
            <input class="form-control" type="search" id="searchbar" name="{{ search_var }}" value="{{ cl.query }}"
                placeholder="Buscar nesta listagem" autocomplete="off"
                {% if cl.search_help_text %} aria-describedby="searchbar_helptext"{% endif %}>
            <button class="btn btn-primary" type="submit">{% translate 'Search' %}</button>
        </div>
        {% if cl.search_help_text %}
            <div class="form-text mb-3" id="searchbar_helptext">{{ cl.search_help_text }}</div>
        {% endif %}
    </div>
{% endif %}
